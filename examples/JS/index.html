<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>js 监控测试</title>
    <script src="./index.global.js"></script>
  </head>
  <body>
    <script src="./initMonitor.js"></script>
    <h1>js 监控测试</h1>
    <button id="codeErr" onclick="codeError()">代码错误</button>
    <button id="normalReq" onclick="onClickXhrNormal()">xhr正常请求</button>
    <button id="exceptionReq" onclick="onClickXhrError()">xhr异常请求</button>
    <button id="normalFetch" onclick="onClickNativeFetch()">Fetch正常请求</button>
    <button id="exceptionFetch" onclick="onClickNativeErrorFetch()">Fetch异常请求</button>
    <button id="logUpload" onclick="monitorLog()">log上报</button>
    <button id="promiseError" onclick="promiseError()">promiseError</button>
    <button id="hashChange" onclick="hashChange()">改变hash</button>
    <button id="mergeReport" onclick="mergeReport()">切换合并上报</button>

    <button id="popState" onclick="pushState('/user/profile')">pushState profile</button>
    <button id="popState" onclick="pushState('/user/orders')">pushState orders</button>

    <a href="/Vue/index.html">跳到Vue页面</a>
    <a href="/React/index.html">跳到React页面</a>
    <a href="/Vue3/index.html">跳到Vue3页面</a>
    <a href="/WebPerformance/index.html">跳到WebPerformance页面</a>

    <div id="app"></div>
    <script src="./index.js"></script>

    <script>
      const Home = () => `
  <div>
    <h1>首页</h1>
    <p>欢迎来到首页</p>
  </div>
`;

      const UserLayout = () => `
  <div>
    <h1>用户中心</h1>

1      <a href="/user/profile" data-router-link>
        用户资料
      </a>

      <a href="/user/orders" data-router-link>
        用户订单
      </a>
    </nav>

    <hr>

    <router-view></router-view>
  </div>
`;

      const UserProfile = () => `
  <div>
    <h2>用户资料</h2>
    <p>这里是用户资料页面</p>
  </div>
`;

      const UserOrders = () => `
  <div>
    <h2>用户订单</h2>
    <p>这里是用户订单页面</p>
  </div>
`;
      const routes = [
        {
          path: '/',
          component: Home,
        },
        {
          path: '/user',
          component: UserLayout,
          children: [
            {
              path: 'profile',
              component: UserProfile,
            },
            {
              path: 'orders',
              component: UserOrders,
            },
          ],
        },
      ];
      const router = new window.Router(routes);
      var flag = false;
      function codeError() {
        let a = {};
        a.split('/');
      }
      function pushState(url) {
        const state = {
          id: '1',
        };
        router.push(state, url);
      }

      function mergeReport() {
        window.encodeMonitor.setEnableBatch(!flag);
      }
      function promiseError() {
        const promiseWrap = () =>
          new Promise((resolve, reject) => {
            reject('promise reject');
          });
        promiseWrap().then((res) => {
          console.log('res', res);
        });
      }

      function monitorLog() {
        encodeMonitor.log({ message: { one: 111 }, tag: 'monitor log' });
      }

      function hashChange() {
        window.location.hash = 'xxx';
      }

      function onClickNativeFetch() {
        fetch('/normal/post', {
          method: 'POST',
          body: JSON.stringify({ test: 'test request body' }),
          mode: 'cors',
          headers: {
            'Content-Type': 'application/json',
          },
        }).then((res) => {
          res.text().then((res) => console.log('res', res));
        });
      }

      function onClickNativeErrorFetch() {
        fetch('/exception/post', {
          method: 'POST',
          body: JSON.stringify({ test: 'test request body' }),
          mode: 'cors',
          headers: {
            'Content-Type': 'application/json',
          },
        }).then(
          (res) => {
            res.text().then((res) => console.log('res', res));
          },
          (err) => {
            console.log('err', err);
          },
        );
      }

      function onClickXhrNormal() {
        const xhr = new XMLHttpRequest();
        xhr.open('get', '/normal');
        xhr.setRequestHeader('content-type', 'application/json');
        xhr.send();
        xhr.onreadystatechange = function () {
          if (xhr.readyState === 4) {
            console.log(xhr.responseText);
          }
        };
      }

      function onClickXhrError() {
        const xhr = new XMLHttpRequest();
        xhr.open('get', '/exception');
        xhr.setRequestHeader('content-type', 'application/json');
        xhr.send();
        xhr.onreadystatechange = function () {
          if (xhr.readyState === 4) {
            console.log(xhr.responseText);
          }
        };
      }
    </script>
  </body>
</html>
